<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Games</title>
    <link rel="stylesheet" href="Styles/STEMpage.css" />
  </head>
  <body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <a class="back" href="index.html">&larr; Back</a>
    <h1>Math</h1>

    <div class="games-wrapper">
      <div class="game">
        <a
          href="game.html?game=Elizabeth Games/fourier/index.html&title=What Wave&author=Elizabeth&from=math.html"
          >What Wave</a
        >
        <img src="assets/Images/WhatWave.png" alt="Game Image" />
        <p>Match the mystery wave, one slider at a time.</p>
        <p>Made by Elizabeth</p>
      </div>

      <div class="game">
        <a
          href="game.html?game=Ella Games/GraphGame1/index.html&title=Feed The Function&author=Ella&from=math.html"
          >Feed The Function</a
        >
        <img src="assets/Images/FunctionLogo.svg" alt="Game Image" />
        <p>Recognize the shape, name the function.</p>
        <p>Made by Ella</p>
      </div>
    </div>
    <script>
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
      }
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light-mode");
    </script>
  </body>
</html>
