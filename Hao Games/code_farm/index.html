<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Farming Learning Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HOME -->
    <main id="home" class="screen">
      <div class="card">
        <h1>CODE FARM</h1>
        <button id="startBtn" class="btn primary">START</button>
        <button id="resetBtn" class="btn">RESET GAME</button>
      </div>
    </main>

    <!-- FARM -->
    <main id="farm" class="screen hidden">
      <div class="topbar">
        <div class="coins">🪙 Coins: <span id="coinsText">50</span></div>

        <div class="rightControls">
          <button id="editBtn" class="btn">Edit Plots</button>
          <button id="nextDayBtn" class="btn primary">Next Day</button>
        </div>
      </div>

      <div class="dayText">Day: <span id="dayText">1</span></div>

      <div id="farmStage" class="farm-stage">
        <img id="farmImg" src="assets/farm.jpg" alt="Farm background" />
      </div>

      <!-- Terminal -->
      <div class="terminal">
        <div class="terminalLabel">Terminal</div>
        <input 
          id="terminalInput"
          class="terminalInput"
          type="text"
          placeholder="Type command here"
          autocomplete="off"
        />
        <div id="terminalOutput" class="terminalOutput"></div>
      </div>

      <!-- Inventory menu -->
      <div id="inventoryBackdrop" class="modal-backdrop hidden">
        <div class="modal">
          <h2>Inventory</h2>
          <p>Your current seeds:</p>

          <div class="choices">
            <div>Flower A Seeds: <span id="inventoryA">0</span></div>
            <div>Flower B Seeds: <span id="inventoryB">0</span></div>
          </div>

          <div class="modalFooter">
            <button id="closeInventoryBtn" class="btn">Close</button>
          </div>
        </div>
      </div>

      <!-- Store menu -->
      <div id="storeBackdrop" class="modal-backdrop hidden">
        <div class="modal">
          <h2>Store</h2>
          <p>Buy seeds for your farms.</p>

          <div class="choices">
            <button id="buyA" class="btn">Buy Flower A seed (Cost 5)</button>
            <button id="buyB" class="btn">Buy Flower B seed (Cost 7)</button>
          </div>

          <p id="storeMessage"></p>
          <div class="modalFooter">
            <button id="closeStoreBtn" class="btn">Close</button>
          </div>
        </div>
      </div>

      <!-- Plant (Modal) -->
      <div id="modalBackdrop" class="modal-backdrop hidden">
        <div class="modal">
          <h2 id="modalTitle">Plant</h2>
          <p id="modalDesc"></p>

          <div id="plantChoices" class="choices">
            <button id="plantA" class="btn">
              Plant Flower A (Cost 5)
            </button>
            <button id="plantB" class="btn">
              Plant Flower B (Cost 7)
            </button>
          </div>

          <div id="harvestChoice" class="choices hidden">
            <button id="harvestBtn" class="btn primary">Harvest</button>
          </div>

          <div id="codeBugArea" class="hidden">
            <p id="bugHint" style="margin-top: 8px;"></p>
            <textarea id="codeEditor" class="codeEditor" spellcheck="false"></textarea>
            <div class="choices" style="margin-top: 10px;">
              <button id="finishFixBtn" class="btn primary">Finish</button>
            </div>
          </div>

          <div class="modalFooter">
            <button id="closeModal" class="btn">Close</button>
          </div>
        </div>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
