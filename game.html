<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="stylesheet" href="Styles/gamePage.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <div class="top">
      <a class="back" id="back-link" href="index.html">&larr; Back</a>
      <button class="htp-btn hidden" id="htp-btn" onclick="openHTPOverlay()">? How to Play</button>
      <div class="title-group">
        <h1 id="game-title"></h1>
        <p id="game-teaches" class="game-teaches"></p>
      </div>
      <button
        class="theme-toggle"
        onclick="toggleTheme()"
        aria-label="Toggle dark/light mode"
      >
        <svg
          class="icon-sun"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg
          class="icon-moon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
      <button class="fullscreen-btn" id="fullscreen-btn" title="Fullscreen">
        &#x26F6;
      </button>
    </div>
    <div class="gameAlign">
      <div id="gameContainer">
        <iframe
          id="game-frame"
          src=""
          frameborder="0"
          tabindex="0"
          allow="microphone; autoplay; fullscreen"
        ></iframe>
      </div>
      <div class="author-badge">Made by <span id="gameAuthor"></span></div>
    </div>

    <!-- How to Play overlay -->
    <div id="htp-overlay" class="htp-overlay hidden" onclick="handleOverlayClick(event)">
      <div class="htp-overlay-inner">
        <div class="htp-overlay-header">
          <h2 class="htp-overlay-title">How to Play</h2>
          <button class="htp-overlay-close" onclick="closeHTPOverlay()">&#x2715; Close</button>
        </div>
        <div class="htp-overlay-body">
          <div id="how-to-play" class="htp-section hidden">
            <div class="htp-heading">
              <span class="htp-heading-label">
                <span class="htp-icon">?</span>
                How to Play
              </span>
            </div>
            <div id="htp-content" class="htp-grid"></div>
          </div>

          <div id="what-youll-learn" class="htp-section hidden">
            <div class="htp-heading">
              <span class="htp-heading-label">
                <span class="htp-icon">💡</span>
                What You'll Learn
              </span>
            </div>
            <div id="wtl-content" class="htp-grid"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
      }
      if (localStorage.getItem("theme") === "light")
        document.documentElement.classList.add("light-mode");
    </script>
  </body>
</html>
