<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technology Games</title>
    <link rel="stylesheet" href="Styles/STEMpage.css" />
  </head>
  <body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <a class="back" href="index.html">&larr; Back</a>
    <h1>Technology</h1>

    <div class="games-wrapper">
      <a href="game.html?game=Hao Games/code_farm/index.html&title=There's a Bug in the Flower!&author=Hao&from=technology.html" class="mobile-card">
        <div class="mc-img-wrapper">
          <img src="assets/Images/Farming Learning Game.svg" class="mc-img" alt="There's a Bug in the Flower!" />
          <span class="mc-info" data-desc="There's a Bug in the Flower! — Debug the farm and grow your code skills — squash bugs to keep the flowers blooming." onclick="event.stopPropagation(); showInfo(this)"></span>
        </div>
      </a>

      <a href="game.html?game=Adrian Games/Game2/Home.html&title=8 Bit Circuit&author=Adrian&from=technology.html" class="mobile-card">
        <div class="mc-img-wrapper">
          <img src="assets/Images/8-BIT Circuit.svg" class="mc-img" alt="8 Bit Circuit" />
          <span class="mc-info" data-desc="8 Bit Circuit — Solve logic puzzles in this retro-inspired circuit game — wire up gates to win." onclick="event.stopPropagation(); showInfo(this)"></span>
        </div>
      </a>
    </div>

    <script>
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
      }
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light-mode");

      function showInfo(el) {
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
        const existing = document.getElementById('mobile-info-popup');
        if (existing) { existing.remove(); return; }
        const desc = el.getAttribute('data-desc');
        const popup = document.createElement('div');
        popup.id = 'mobile-info-popup';
        popup.className = 'mobile-info-popup';
        popup.textContent = desc;
        popup.addEventListener('click', (e) => { e.stopPropagation(); popup.remove(); });
        document.body.appendChild(popup);
        const rect = el.getBoundingClientRect();
        const top = rect.top + window.scrollY - 8;
        const left = Math.max(12, Math.min(rect.right - 220, window.innerWidth - 232));
        popup.style.top = top + 'px';
        popup.style.left = left + 'px';
        popup.style.transform = 'translateY(-100%)';
        setTimeout(() => popup.remove(), 4000);
      }
      document.addEventListener('click', () => {
        const p = document.getElementById('mobile-info-popup');
        if (p) p.remove();
      });
    </script>
  </body>
</html>
