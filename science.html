<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Science Games</title>
    <link rel="stylesheet" href="Styles/STEMpage.css" />
  </head>
  <body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <a class="back" href="index.html">&larr; Back</a>
    <h1>Science</h1>

    <div class="games-wrapper">
      <div class="game">
        <a
          href="game.html?game=Adrian Games/Game1/index.html&title=Physics Game Lab&author=Adrian Botello&from=science.html"
          >Absolute Physics Master Lab</a
        >
        <img src="assets/Images/PhysicsGameLab.svg" alt="Game Image" />
        <p>Play with physics concepts in this interactive lab!</p>
        <p>Made by Adrian</p>
      </div>

      <div class="game">
        <a
          href="game.html?game=Eli Games/Sound and Valid/dist/index.html&title=Sound and Valid&author=Eli Olson&from=science.html"
          >Sound and Valid</a
        >
        <img src="assets/Images/SoundAndValid.svg" alt="Game Image" />
        <p>Wave hello to natural frequency!</p>
        <p>Made by Eli</p>
      </div>

      <div class="game">
        <a href="#" aria-disabled="true">Reaction Lab</a>
        <div class="game-img-placeholder">Cover image coming soon</div>
        <p>Coming soon — chemistry reactions in the lab.</p>
        <p>Made by TBA</p>
      </div>
    </div>
    <script>
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
      }
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light-mode");
    </script>
  </body>
</html>
