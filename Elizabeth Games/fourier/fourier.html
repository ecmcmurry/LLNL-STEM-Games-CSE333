<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fourier Demo</title>
<style>

  /* TODO: Update for light-mode toggle */
  body {
    background: #0d0d14;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-primary);
  }

  /* Used for the Score text. Used to include the title for the game, hence the name card-title
  TODO: Update to match new purpose
  TODO: Update for light-mode toggle*/
  .card-title {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #7fefbd;
  }

  /* Acts as a wrapper for the canvas. It rounds the corners and clips anything that extends out of bounds
  TODO: Update for light-mode toggle*/
  .canvas-wrapper {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #0d0d14;
  }

  canvas {
    display: block;
    width: 100%;
  }
  
  /* This is the information for the list that contains the subwave sliders
  Basically just denotes that the slider sets are grouped into rows(and therefore stacked in a column) with an 8px gap*/
  .subwave-list {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* This determines the visuals of the actual row contianing the subwave sliders
  TODO: Update for light-mode toggle */
  .subwave-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  /* This is responsible for the circle containing the color of the subwave */
  .subwave-color {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* This controls the text containing the wave number
  TODO: Update for light-mode toggle */
  .subwave-label {
    font-family: 'Space Mono', monospace;
    font-size: 25px;
    color: #ffffff;
    flex: 1;
  }
  
  /* Controls the gap between the parameter sliders and how they are oriented */
  .param-chips {
    display: flex;
    gap: 6px;
  }

  /* Controls the display of the sliders, like their colors and background
  TODO: Update for light-mode toggle */
  .chip {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.06);
  }

</style>
</head>
<body>

<div class="wave-card">
	
  <div class="card-header">
    <div class="card-title" id="scoreDisplay">Score: 0</div>
  </div>

  <!-- TODO: adjust sizing for mobile -->
  <div class="canvas-wrapper">
    <canvas id="waveCanvas" width="1240" height="420"></canvas>
  </div>

  <div class="subwave-list" id="subwaveList"></div>

</div>

<script>
  //Defines the subwaves and realwaves, consisitng of amplitude, frequency, phase, color, and whether the wave is enabled
  //TODO: change enabled logic
  //TODO: introduce color editing for subwaves
  let subwaves = [
    { amplitude: 0.5, frequency: 2.5,  phase: 0,   color: '#00ff2f',	enabled: 1 },
    { amplitude: 0.5, frequency: 2.5,  phase: 0,   color: '#fff200',	enabled: 0 },
    { amplitude: 0.5, frequency: 2.5,  phase: 0,   color: '#74c0fc',	enabled: 0 },
    { amplitude: 0.5, frequency: 2.5,  phase: 0,   color: '#da77f2',	enabled: 0 },
  ];
  
  let realwaves = [
    { amplitude: randomRounded(0, 1, 0.05), frequency: 2.5,  phase: 0,   enabled: 1 },
    { amplitude: randomRounded(0, 1, 0.05), frequency: 2.5,  phase: 0,   enabled: 0 },
    { amplitude: randomRounded(0, 1, 0.05), frequency: 2.5,  phase: 0,   enabled: 0 },
    { amplitude: randomRounded(0, 1, 0.05), frequency: 2.5,  phase: 0,   enabled: 0 },
  ];

	// gets the canvas and declares variables
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const list = document.getElementById('subwaveList');

  //Sets the time-window to be from 0s to 2s
  const tMin = 0;
  const tMax = 2.0;
  
  //Generates a random number between min and max, then rounds according to rnd
  function randomRounded(min, max, rnd) {
    let value = Math.random() * (max - min) + min;
    let scalingFactor = 100/(rnd*100)
    return Math.round(value * scalingFactor) / scalingFactor;
	}

  //Returns the amplitude of a wave at a given time(t) based on it's components
  function generateWave(wave, t) {
    if(wave.enabled) {
      //y(t) = Asin(2pi*frequency*t + phase)
      return wave.amplitude * Math.sin(2 * Math.PI * wave.frequency * t + wave.phase);
    } else {
      return 0;
    }
  }

	//Returns the amplitude of a compositve wave at a given time(t) based on the component waves
  function generateComposite(t, type) {
    let sum = 0;
    if (type == "Player") {
      //for each enabled subwave, generate the wave and add it to the sum
      subwaves.forEach(wave => {
        if(wave.enabled) {
          sum += generateWave(wave, t)
        }
      });
      return sum;
    } else {
      realwaves.forEach(wave => {
        if(wave.enabled) {
          sum += generateWave(wave, t)
        }
      });
      return sum;
    }
  }

  function draw() {
    //clears whatever is on screen
    ctx.clearRect(0, 0, W, H);

    //declare relevant variables
    const padX = 40;
    const padY = 40;
    const plotW = W - 2 * padX;
    const plotH = H - 2 * padY;
    const midY = H / 2;

    //Determines the Maximum Amplitude of the Real Wave and scales the view accordingly
    //This should prevent waves from extending beyond the boundaries now
    let maxAmp = 0;
    realwaves.forEach(wave => {
      if(wave.enabled) {
        maxAmp += wave.amplitude;
      }
    });
    let scaleY = (plotH / 2);
    if ((maxAmp*scaleY) > midY) {
      scaleY = (plotH / 2) / maxAmp * 1.1;
    }              

    //Drawing the horizontal grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;

    for (let i = 1; i <= 7; i++) {
      //Skips the middlemost line as it is drawn bolder later
      if (i == 4) {
        //The zero line is drawn less translucent
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      }
      //determines the y axis of the line
      //This is done by advancing along the useable space(plotH) by eigths
      //advancing by eigths provides three minor grid lines above and below the zero line for a total of 7
      let y = (padY + (plotH * (i / 8)));
      ctx.beginPath();
      ctx.moveTo(padX, y);
      ctx.lineTo(W - padX, y);
      ctx.stroke();

      //I assume it's more efficient to always set this back to normal than include a second conditional
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    }

    //Drawing the vertical grid lines
    //This is done by advancing along the useable space(plotW) by eigths
    //advancing by eigths provides seven minor grid lines, so there are the same horiz and vert after adding the zero-line
    for (let i = 1; i <= 7; i++) {
      let x = (padX + (plotW * (i / 8)));
      ctx.beginPath();
      ctx.moveTo(x, padY);
      ctx.lineTo(x, H - padY);
      ctx.stroke();
    }

    //This is the number of "samples" aka the resolution of the wave
    const N = 1200;

    // Draw sub-waves
    subwaves.forEach(wave => {
      if(wave.enabled) {
        ctx.beginPath();
        ctx.strokeStyle = wave.color;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.45;
        ctx.setLineDash([15, 10]);

        //maybe offload this into it's own function? Called for subwaves, player composite, and target composite
        //This is what is responsible for actually plotting the wave
        //For each step in the Resolution
        for (let i = 0; i <= N; i++) {
          //convert i into a time t
          let t = tMin + ((tMax - tMin) * (i / N));
          //use the time to get the amplitude of the wave at that time
          let y = generateWave(wave, t);
          //converts the time and amplitude into canvas coordinates
          let px = padX + plotW * (i / N);
          let py = midY - y * scaleY;
          //for the first point we need to move the "pen" without drawing, but every other point is drawn from the previous step
          if (i === 0) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.stroke();
      }
    });

    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // Draw player composite wave
    ctx.beginPath();
    ctx.strokeStyle = '#7fefbd';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#7fefbd';
    ctx.shadowBlur = 10;

    for (let i = 0; i <= N; i++) {
      let t = tMin + ((tMax - tMin) * (i / N));
      let y = generateComposite(t, "Player");
      let px = padX + plotW * (i / N);
      let py = midY - y * scaleY;
      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Draw target composite wave
    ctx.beginPath();
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10;
    ctx.globalAlpha = 0.75;
    
    //This is how the target wave has its - . . . pattern
    //20 pixels drawn, 3 pixels skipped, 3 pixels drawn, 3 pixels skipped, 3 pixels drawn, 3 pixels skipped, 3 pixels drawn, 3 pixels skipped
    ctx.setLineDash([20, 3, 3, 3, 3, 3, 3, 3]);

    for (let i = 0; i <= N; i++) {
      let t = tMin + ((tMax - tMin) * (i / N));
      let y = generateComposite(t);
      let px = padX + plotW * (i / N);
      let py = midY - y * scaleY;
      if (i === 0) {
        ctx.moveTo(px, py);
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    ctx.setLineDash([]);

    // Axis labels
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '18px Space Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('0s', padX, midY + 20);
    ctx.fillText('2s', W - padX, midY + 20);
  }


//Just to be blatantly honest, this function is all ChatGPT's doing, but I've done my best to understand it
//This function is used for adding/removing the amplitude, frequency, and phase sliders for waves 1-4 as necessary
//it also holds the unified listener for all sliders
function updateSliders() {
  //this clears the existing sliders
  list.innerHTML = "";

  //then for each subwave
  subwaves.forEach((w, i) => {
    //only run if the wave is enabled
    if (w.enabled) {
      //First we create a row of sliders
      let row = document.createElement('div');
      row.className = 'subwave-row';

      //The row we created is then given this chunk of HTML
      //this HTML is responsible for displaying the different sliders(amplitude, freuquency, phase);
      row.innerHTML = `
        <div class="subwave-color" style="background:${w.color}"></div>
        <div class="subwave-label">Wave ${i + 1}</div>
        <div class="param-chips">
          <div class="chip">
            A = <span id="ampVal${i}">${w.amplitude.toFixed(2)}</span>
            <input type="range"
              min="0"
              max="1"
              step="0.05"
              value="${w.amplitude}"
              data-index="${i}"
              data-param="amplitude">
          </div>
          <div class="chip">
            f = <span id="freqVal${i}">${w.frequency.toFixed(2)}</span>
            <input type="range"
              min="0.5"
              max="5"
              step="0.1"
              value="${w.frequency}"
              data-index="${i}"
              data-param="frequency">
          </div>
          <div class="chip">
            φ = <span id="phaseVal${i}">${(w.phase / Math.PI).toFixed(2)}π</span>
            <input type="range"
              min="0"
              max="${2 * Math.PI}"
              step="${0.05 * Math.PI}"
              value="${w.phase}"
              data-index="${i}"
              data-param="phase">
          </div>
        </div>
      `;

      //this attaches the rows to our list
      list.appendChild(row);
    }
  });

  //Again, to be blatantly honest, this code is also ChatGPTs
  //this finds every slider within list, and for each slider:
  list.querySelectorAll('input[type="range"]').forEach(input => {
    //adds an event listener for whenever the slider changes:
    input.addEventListener('input', (e) => {
      //Determines which slider(param) for which wave(input) changed and pulls the new value
      const index = e.target.dataset.index;
      const param = e.target.dataset.param;
      const value = parseFloat(e.target.value);

      //This value is then assigned to the correct wave and it's correct component/parameter
      subwaves[index][param] = value;

      //The displayed value for the slider is then updated
      if (param === "phase") {
        document.getElementById(`phaseVal${index}`).textContent =
          (value / Math.PI).toFixed(2) + "π";
      } else if (param === "frequency") {
        document.getElementById(`freqVal${index}`).textContent =
          value.toFixed(2);
      } else {
        document.getElementById(`ampVal${index}`).textContent =
          value.toFixed(2);
      }
      
      //redraw the canvas and check if the current player composite wave matches the target composite wave
      draw();
      checkSolution();
    });
  });
}

//We are now back to code that was written by me
let ampEnabled = true; // initial state
let freEnabled = false; // initial state
let phaEnabled = false; // initial state

//Generates a new wave according to the current criteria (wave count, amplitude enabled, etc.)
function reroll() {
    realwaves.forEach(wave => {
		  if(ampEnabled) {
       	wave.amplitude = randomRounded(0.05, 1, 0.05) * wave.enabled;
        //console.log(wave.amplitude);
      } else {
      	wave.amplitude = 0.5 * wave.enabled;
      }
      
      if(freEnabled) {
      	wave.frequency = randomRounded(0.5, 5, 0.1) * wave.enabled;
        //console.log(wave.frequency);
      } else {
      	wave.frequency = 2.5 * wave.enabled;
      }
      
      if(phaEnabled) {
      	wave.phase = Math.PI*randomRounded(0, 2, 0.05) * wave.enabled;
        //console.log(wave.phase);
      } else {
      	wave.phase = 0 * wave.enabled;
      }
      draw();
	})
}


let waveCount = 1;
let score = 0;
const scoreDisplay = document.getElementById("scoreDisplay");

//Updates the difficulty of the game according to the score
function changeDifficulty() {
  //at certain score thresholds, the waveCount needs to increase
  //disable all waves
  realwaves.forEach(wave => {
	  wave.enabled = 0;
	});
  subwaves.forEach(wave => {
	  wave.enabled = 0;
	});
  //check score against stages
  //update waveCount and enable relevant variables
  //TODO: More playtesting to refine difficulty curve
  //TODO: Update to table-based instead of huge case statement
  switch(score) {
    case 1:
      //this is just redundant, but I want this to work right, even if it means having some redundancies
      //1 Wave, Amplitude only
      waveCount = 1;
      ampEnabled = true;
      freEnabled = false;
      phaEnabled = false;
      break;
    case 2:
      //1 Wave, Amplitude and Frequency
      waveCount = 1;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = false;
      break;
    case 4:
      //1 Wave, Amplitude, Frequency, and Phase
      waveCount = 1;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = true;
      break;
    case 6:
      //2 Waves, Amplitude and Frequency
      waveCount = 2;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = false;
      break;
    case 9:
      //2 Waves, Amplitude, Frequency, and Phase
      waveCount = 2;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = true;
      break;
    case 12:
      //3 Waves, Amplitude and Frequency
      waveCount = 3;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = false;
      break;
    case 15:
      //3 Waves, Amplitude, Frequency, and Phase
      waveCount = 3;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = true;
      break;
    case 18:
      //4 Waves, Amplitude and Frequency
      waveCount = 4;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = false;
      break;
    case 21:
      //4 Waves, Amplitude, Frequency, and Phase
      waveCount = 4;
      ampEnabled = true;
      freEnabled = true;
      phaEnabled = true;
      break;
  }


  for (let i = 0; i < waveCount; i++) {
      subwaves[i].enabled = 1;
      realwaves[i].enabled = 1;
  }
  reroll();
  updateSliders();
  draw();
}

//Increases the score and updates the text
//Delegated to it's own function in case more logic needs to be extended (such as adding a continue button)
function increaseScore(){
  score = score + 1;
  scoreDisplay.textContent = "Score: " + score;
}

//Checks the current list of subwaves against the list of realwaves to determine if they match
function checkSolution(){
  //Simply need to check each of the subwaves against each of the real waves, incrementing a "correctness" score for each match
  //if the correctness equals or exceeds the number of active waves, then the player correctly identified the wave
  //upon properly identifying the wave, the player's score increases and a new wave is generated

  let correctness = 0;
  subwaves.forEach(swave => {
    //only runs for each relevant sub wave
    if (swave.enabled) {
      //
      realwaves.forEach(rwave => {
        //only runs for each relevant real wave
        if (rwave.enabled) {
          //Theres probably a better way to see if they are matching
          if ((swave.amplitude == rwave.amplitude) && (swave.frequency == rwave.frequency) && ((rwave.phase/Math.PI)-(swave.phase/Math.PI) < 0.05)) {
            correctness++;
          }
        }
      });
    }
  });
  if (correctness >= waveCount) {
    increaseScore();
    changeDifficulty();
  }
}

// Initial draw
updateSliders();
changeDifficulty();
draw();


</script>
</body>
</html>
