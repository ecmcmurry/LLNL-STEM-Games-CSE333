<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Styles/styles.css" />
    <title>AI Arcademia</title>
  </head>
  <body>
    <!-- Mobile only: sidebar + top bar + nav -->
    <div id="sidebar" class="sidebar">
      <a href="javascript:void(0)" class="closebtn" onclick="toggleSidebar()"
        >&times;</a
      >
      <a href="index.html">Home</a>
      <a href="science.html">Science Games</a>
      <a href="technology.html">Technology Games</a>
      <a href="engineering.html">Engineering Games</a>
      <a href="math.html">Math Games</a>
      <a href="about.html">About</a>
    </div>

    <div class="top-bar">
      <h1 id="logo" onclick="toggleSidebar()">
        <span>&#9662;</span> AI Arcademia
      </h1>
    </div>

    <nav id="main-nav">
      <a href="science.html">S &mdash; Science</a>
      <a href="technology.html">T &mdash; Technology</a>
      <a href="engineering.html">E &mdash; Engineering</a>
      <a href="math.html">M &mdash; Math</a>
    </nav>

    <!-- Dark/light mode toggle for desktop -->
    <button
      id="theme-toggle"
      class="theme-toggle"
      onclick="toggleTheme()"
      aria-label="Toggle dark/light mode"
    >
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>

    <!-- Desktop: Hero section -->
    <section class="hero-section">
      <h1 class="hero-title">AI Arcademia</h1>
      <p class="hero-subtitle">STEM AI Games</p>
      <a href="about.html" class="about-btn">About</a>
      <div class="scroll-hint">&#9660;</div>
    </section>

    <!-- Desktop: STEM strip — sticky, sits at bottom of hero then locks to top -->
    <div class="stem-strip">
      <div class="stem-strip-letter" data-cat="s" onclick="selectCategory('s')">
        <img class="stem-strip-bg" src="assets/Images/science.svg" alt="" />
        <span class="stem-strip-char">S</span>
      </div>
      <div class="stem-strip-letter" data-cat="t" onclick="selectCategory('t')">
        <img class="stem-strip-bg" src="assets/Images/technology.svg" alt="" />
        <span class="stem-strip-char">T</span>
      </div>
      <div class="stem-strip-letter" data-cat="e" onclick="selectCategory('e')">
        <img class="stem-strip-bg" src="assets/Images/engineering.svg" alt="" />
        <span class="stem-strip-char">E</span>
      </div>
      <div class="stem-strip-letter" data-cat="m" onclick="selectCategory('m')">
        <img
          class="stem-strip-bg"
          src="assets/Images/math_waves.png"
          alt=""
          style="object-fit: contain; transform: scale(1.5)"
        />
        <span class="stem-strip-char">M</span>
      </div>
    </div>

    <!-- Desktop: Games section -->
    <section class="games-section" id="games-section">
      <div class="games-grid">
        <!-- Science -->
        <div class="games-col" data-cat="s">
          <a href="game.html?game=Adrian Games/Game1/index.html&title=Physics Game Lab&author=Adrian&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/PhysicsGameLab.svg" class="dc-img" alt="Physics Game Lab" />
              <span class="dc-info" data-desc="Physics Game Lab — Play with physics concepts in this interactive lab — explore gravity, motion, and collisions hands-on." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
          <a href="game.html?game=Eli Games/Sound and Valid/dist/index.html&title=Sound and Valid&author=Eli&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/SoundAndValid.svg" class="dc-img" alt="Sound and Valid" />
              <span class="dc-info" data-desc="Sound and Valid — Wave hello to natural frequency! Explore harmonics and resonance through sound." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
          <a href="game.html?game=Elizabeth Games/chemistry/index.html&title=Reaction Lab&author=Elizabeth&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/ReactionLab.png" class="dc-img" alt="Reaction Lab" />
              <span class="dc-info" data-desc="Reaction Lab — A virtual chemistry lab where you mix reagents and observe reactions." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
        </div>

        <!-- Technology -->
        <div class="games-col" data-cat="t">
          <a href="game.html?game=Hao Games/code_farm/index.html&title=There's a Bug in the Flower!&author=Hao&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/Farming Learning Game.svg" class="dc-img" alt="There's a Bug in the Flower!" />
              <span class="dc-info" data-desc="There's a Bug in the Flower! — Debug the farm and grow your code skills — squash bugs to keep the flowers blooming." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
          <a href="game.html?game=Adrian Games/Game2/Home.html&title=8 Bit Circuit&author=Adrian&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/8-BIT Circuit.svg" class="dc-img" alt="8 Bit Circuit" />
              <span class="dc-info" data-desc="8 Bit Circuit — Solve logic puzzles in this retro-inspired circuit game — wire up gates to win." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
        </div>

        <!-- Engineering -->
        <div class="games-col" data-cat="e">
          <a href="game.html?game=Ella Games/Game2Engineering/index.html&title=Forge %26 Fortune&author=Ella&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/Forge & Fortune.svg" class="dc-img" alt="Forge &amp; Fortune" />
              <span class="dc-info" data-desc="Forge &amp; Fortune — Forge materials, balance their properties, and negotiate with customers for pay." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
          <a href="game.html?game=Eli Games/StructureStrike/dist/index.html&title=StructureStrike&author=Eli&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/StructureStrike.svg" class="dc-img" alt="StructureStrike" />
              <span class="dc-info" data-desc="StructureStrike — Build structures and survive the forces — engineer beams that hold under load." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
        </div>

        <!-- Math -->
        <div class="games-col" data-cat="m">
          <a href="game.html?game=Elizabeth Games/fourier/index.html&title=What Wave&author=Elizabeth&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/WhatWave.png" class="dc-img" alt="What Wave" />
              <span class="dc-info" data-desc="What Wave — Adjust waves and combine to match a target wave." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
          <a href="game.html?game=Ella Games/GraphGame1/index.html&title=Feed The Function&author=Ella&from=index.html" class="desktop-card">
            <div class="dc-img-wrapper">
              <img src="assets/Images/FunctionLogo.svg" class="dc-img" alt="Feed the Function" />
              <span class="dc-info" data-desc="Feed The Function — Recognize the shape, name the function, feed the right answer to advance." onclick="event.stopPropagation(); showInfo(this)"></span>
            </div>
          </a>
        </div>
      </div>
    </section>

    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.style.left = sidebar.style.left === "0px" ? "-250px" : "0px";
      }

      function selectCategory(cat) {
        const letters = document.querySelectorAll(".stem-strip-letter");
        const cols = document.querySelectorAll(".games-col");
        const clickedLetter = document.querySelector(
          `.stem-strip-letter[data-cat="${cat}"]`,
        );
        const isAlreadyActive = clickedLetter.classList.contains("stem-active");

        if (isAlreadyActive) {
          letters.forEach((el) => el.classList.remove("stem-active", "stem-dimmed"));
          cols.forEach((el) => el.classList.remove("stem-active", "stem-dimmed"));
          return;
        }

        window.scrollTo({
          top: document.querySelector(".stem-strip").offsetTop,
          behavior: "smooth",
        });

        letters.forEach((el) => {
          el.classList.toggle("stem-active", el.dataset.cat === cat);
          el.classList.toggle("stem-dimmed", el.dataset.cat !== cat);
        });
        cols.forEach((el) => {
          el.classList.toggle("stem-active", el.dataset.cat === cat);
          el.classList.toggle("stem-dimmed", el.dataset.cat !== cat);
        });
      }

      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
      }

      if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.add("light-mode");
      }

      // Typing animation for "AI Arcademia" title
      window.addEventListener("DOMContentLoaded", () => {
        const title = document.querySelector(".hero-title");
        if (!title) return;
        const text = title.textContent;
        title.textContent = "";
        title.classList.add("typing");
        let i = 0;
        const step = () => {
          if (i < text.length) {
            title.textContent += text[i++];
            setTimeout(step, 110);
          }
        };
        setTimeout(step, 350);
      });

      // Mobile info popup (touch devices only)
      function showInfo(el) {
        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
        const existing = document.getElementById('mobile-info-popup');
        if (existing) { existing.remove(); return; }
        const desc = el.getAttribute('data-desc');
        const popup = document.createElement('div');
        popup.id = 'mobile-info-popup';
        popup.className = 'mobile-info-popup';
        popup.textContent = desc;
        popup.addEventListener('click', (e) => { e.stopPropagation(); popup.remove(); });
        document.body.appendChild(popup);
        const rect = el.getBoundingClientRect();
        const top = rect.top + window.scrollY - 8;
        const left = Math.max(12, Math.min(rect.right - 220, window.innerWidth - 232));
        popup.style.top = top + 'px';
        popup.style.left = left + 'px';
        popup.style.transform = 'translateY(-100%)';
        setTimeout(() => popup.remove(), 4000);
      }

      document.addEventListener('click', () => {
        const p = document.getElementById('mobile-info-popup');
        if (p) p.remove();
      });
    </script>
  </body>
</html>
