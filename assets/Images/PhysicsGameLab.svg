<svg viewBox="0 0 832 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;400&amp;display=swap');
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2f4a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect for lines -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="832" height="560" fill="url(#bgGradient)"/>
  
  <!-- Retro grid lines -->
  <g opacity="0.15" stroke="#5DD9E8" stroke-width="1.5" fill="none">
    <!-- Horizontal lines with perspective -->
    <line x1="0" y1="100" x2="832" y2="100"/>
    <line x1="50" y1="150" x2="782" y2="150"/>
    <line x1="100" y1="200" x2="732" y2="200"/>
    <line x1="150" y1="250" x2="682" y2="250"/>
    <line x1="200" y1="300" x2="632" y2="300"/>
    
    <line x1="200" y1="350" x2="632" y2="350"/>
    <line x1="150" y1="400" x2="682" y2="400"/>
    <line x1="100" y1="450" x2="732" y2="450"/>
    <line x1="50" y1="500" x2="782" y2="500"/>
    
    <!-- Vertical lines -->
    <line x1="200" y1="100" x2="250" y2="500"/>
    <line x1="300" y1="100" x2="340" y2="500"/>
    <line x1="400" y1="100" x2="430" y2="500"/>
    <line x1="500" y1="100" x2="520" y2="500"/>
    <line x1="600" y1="100" x2="610" y2="500"/>
  </g>
  
  <!-- Flowing wave lines -->
  <g opacity="0.3" stroke="#5DD9E8" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M -50 180 Q 150 160, 300 180 T 650 180 T 900 180" stroke-width="1.5"/>
    <path d="M -50 420 Q 150 440, 300 420 T 650 420 T 900 420" stroke-width="1.5"/>
  </g>
  
  <!-- Retro circles -->
  <g opacity="0.08" stroke="#5DD9E8" stroke-width="2" fill="none">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="100" cy="100" r="120"/>
    <circle cx="732" cy="460" r="60"/>
    <circle cx="732" cy="460" r="90"/>
  </g>
  
  <!-- Diagonal accent lines -->
  <g opacity="0.2" stroke="#FF6B9D" stroke-width="2" fill="none" filter="url(#glow)">
    <line x1="0" y1="0" x2="200" y2="200"/>
    <line x1="632" y1="360" x2="832" y2="560"/>
    <line x1="50" y1="0" x2="250" y2="200"/>
    <line x1="582" y1="360" x2="782" y2="560"/>
  </g>
  
  <!-- Main title -->
  <text x="416" y="280" 
        font-family="Inter, sans-serif" 
        font-size="72" 
        font-weight="700" 
        fill="#5DD9E8" 
        text-anchor="middle"
        letter-spacing="0.05em"
        filter="url(#glow)">
    PHYSICS GAME LAB
  </text>
  
  <!-- Subtitle -->
  <text x="416" y="360" 
        font-family="Inter, sans-serif" 
        font-size="28" 
        font-weight="400" 
        fill="#94A3B8" 
        text-anchor="middle"
        letter-spacing="0.02em">
    Roll a ball. Measure gravity. Become a physicist.
  </text>
</svg>