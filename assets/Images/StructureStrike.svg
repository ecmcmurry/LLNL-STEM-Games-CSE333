<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <style>
      @font-face {
        font-family: 'PixelPurl';
        src: url('data:font/truetype;base64,') format('truetype');
      }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="225" fill="#0a0e1a"/>
  <rect width="400" height="225" fill="url(#grid)"/>

  <text x="200" y="100"
    font-family="PixelPurl, Courier New, monospace"
    font-size="44"
    font-weight="normal"
    fill="#00e5ff"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="1"
    filter="url(#glow)">StructureStrike</text>

  <text x="200" y="158"
    font-family="PixelPurl, Courier New, monospace"
    font-size="19"
    fill="#b8d0e8"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="2">BUILD · SURVIVE · ENGINEER</text>
</svg>